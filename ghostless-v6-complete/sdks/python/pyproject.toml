[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostless"
version = "6.0.0"
description = "Python SDK for the Ghostless trust scoring and fraud detection API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["ghostless", "trust-score", "fraud-detection", "crowdsourcing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = []   # zero required dependencies — stdlib only

[project.optional-dependencies]
async = ["httpx>=0.25.0"]
all   = ["httpx>=0.25.0"]
dev   = ["httpx>=0.25.0", "pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage    = "https://ghostless.io"
Repository  = "https://github.com/ghostless/ghostless-python"
Documentation = "https://docs.ghostless.io/sdks/python"

[tool.hatch.build.targets.wheel]
packages = ["ghostless"]
