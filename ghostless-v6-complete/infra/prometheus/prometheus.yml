global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: '${ENVIRONMENT:-production}'
    service:     'ghostless'

# ── Alerting ──────────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # add alertmanager endpoint here

# ── Rules ─────────────────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# ── Scrape configs ────────────────────────────────────────────────────────────
scrape_configs:

  # Ghostless API metrics (exposed at /metrics by prometheus-fastapi-instrumentator)
  - job_name: 'ghostless-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # Celery worker metrics (via Flower prometheus exporter)
  - job_name: 'celery-flower'
    static_configs:
      - targets: ['flower:5555']
    metrics_path: /metrics

  # PostgreSQL metrics (add postgres_exporter sidecar for full DB metrics)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis metrics (add redis_exporter sidecar)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # Node (host) metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
