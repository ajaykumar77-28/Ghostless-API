# ─────────────────────────────────────────────────────────────────────────────
# Ghostless API — Nginx Production Config
#
# Features:
#   - Rate limiting per IP and per tenant API key
#   - Connection limiting
#   - Gzip compression
#   - SSL/TLS with strong ciphers
#   - Security headers (CSP, HSTS, X-Frame-Options)
#   - Upstream load balancing across API replicas
#   - WebSocket proxy for /v1/hub
#   - Monitoring endpoints protected
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"ip":"$remote_addr",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"user_agent":"$http_user_agent",'
            '"request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    keepalive_requests 1000;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 256;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Per-IP: 30 req/s globally
    limit_req_zone  $binary_remote_addr zone=global_ip:10m rate=30r/s;
    # Per-tenant (extracted from X-Tenant-ID header): 100 req/s
    limit_req_zone  $http_x_tenant_id   zone=tenant:10m   rate=100r/s;
    # Validate endpoint (hot path): separate zone
    limit_req_zone  $binary_remote_addr zone=validate:10m  rate=20r/s;
    # Login/auth: very restrictive
    limit_req_zone  $binary_remote_addr zone=auth:10m      rate=5r/m;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn conn_limit 100;

    # ── Upstream API pool ──────────────────────────────────────────────────────
    upstream ghostless_api {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=30s;
        # Add more replicas here:
        # server api_2:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Redirect HTTP → HTTPS ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── Main HTTPS server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.ghostless.io;   # ← change to your domain

        # ── TLS ────────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ── Security headers ───────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options   "nosniff"      always;
        add_header X-Frame-Options          "DENY"         always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

        # ── Proxy settings ────────────────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Request-ID       $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffer_size     16k;
        proxy_buffers         4 32k;

        # ── Request size limits ────────────────────────────────────────────────
        client_max_body_size 10m;
        client_body_timeout  30s;

        # ── Auth endpoints (very restricted) ──────────────────────────────────
        location ~ ^/v1/(auth|tenants) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://ghostless_api;
        }

        # ── Validate endpoint (hot path, stricter IP rate limit) ───────────────
        location /v1/validate {
            limit_req zone=validate burst=40 nodelay;
            limit_req zone=tenant   burst=200 nodelay;
            proxy_pass http://ghostless_api;
        }

        # ── WebSocket for /v1/hub ──────────────────────────────────────────────
        location /v1/hub {
            proxy_pass http://ghostless_api;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ── Metrics (internal only) ────────────────────────────────────────────
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://ghostless_api;
        }

        # ── Health check (public, no rate limit) ──────────────────────────────
        location /health {
            proxy_pass http://ghostless_api;
            access_log off;
        }

        # ── Default API ────────────────────────────────────────────────────────
        location / {
            limit_req zone=global_ip burst=60 nodelay;
            limit_req zone=tenant   burst=200 nodelay;
            proxy_pass http://ghostless_api;
        }
    }
}
